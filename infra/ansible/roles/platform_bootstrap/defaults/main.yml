# Rôle platform_bootstrap : installe Argo CD et lui confie le reste (app-of-apps).
# À jouer une fois le cluster prêt (API joignable, nœuds Ready).

# kubeconfig admin sur le nœud où le rôle s'exécute (kubeadm : /etc/kubernetes/admin.conf).
platform_kubeconfig: /etc/kubernetes/admin.conf

# Version du chart Argo CD : fixée pour que deux installations donnent le même résultat.
platform_argocd_chart_version: "10.11.1"

# Installer python3-kubernetes (nœud Debian/Ubuntu). false si la lib est déjà là.
platform_install_deps: true

# Binaire helm installé sur le nœud s'il est absent.
platform_helm_version: "v3.16.4"
# Les VM AWS du groupe sont en ARM (t4g). amd64 pour un labo x86.
platform_helm_arch: arm64

# Mot de passe admin de Grafana. À fournir via ansible-vault ; vide = généré au premier
# passage. Le Secret n'est jamais écrasé ensuite, le mot de passe reste donc stable.
platform_grafana_admin_password: ""

# Attente de la première synchronisation de l'Application racine.
platform_wait_retries: 30
platform_wait_delay: 10
