apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logs
  namespace: argocd
  # Supprimer cette Application (ex. retirer ce fichier de Git) supprime aussi
  # tout ce qu'elle a déployé. Sans ça, les ressources restent orphelines.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:3000/hamid/kube-infra.git
    targetRevision: main
    path: infra/components/logs
  destination:
    server: https://kubernetes.default.svc
    namespace: logs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
