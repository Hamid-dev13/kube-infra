apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  # Supprimer cette Application (ex. retirer ce fichier de Git) supprime aussi
  # tout ce qu'elle a déployé. Sans ça, les ressources restent orphelines.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Hamid-dev13/kube-infra.git
    targetRevision: main
    path: infra/components/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Les CRDs de prometheus-operator dépassent la taille max de l'annotation
      # last-applied-configuration : l'apply côté serveur contourne la limite.
      - ServerSideApply=true
