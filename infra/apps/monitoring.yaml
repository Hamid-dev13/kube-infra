apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:3000/hamid/kube-infra.git
    targetRevision: main
    path: infra/components/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Les CRDs de prometheus-operator dépassent la taille max de l'annotation
      # last-applied-configuration : l'apply côté serveur contourne la limite.
      - ServerSideApply=true
