apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alerts.yaml
helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 92.11.0
    releaseName: kps
    namespace: monitoring
    includeCRDs: true
    valuesFile: values.yaml
